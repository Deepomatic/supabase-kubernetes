{{- if .Values.deployment.vector.enabled -}}
{{- if .Values.serviceAccount.vector.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.vector.serviceAccountName" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.vector.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
# Cluster-scoped: suffix with the release namespace so multiple supabase
# instances on the same cluster do not collide on a single shared object.
metadata:
  name: {{ include "supabase.fullname" . }}-reader-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    resourceNames:
      - {{ include "supabase.fullname" . }}-*
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "supabase.fullname" . }}-view-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "supabase.vector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "supabase.fullname" . }}-reader-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
