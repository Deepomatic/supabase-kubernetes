{{- if and .Values.deployment.db.enabled .Values.deployment.db.streaming.enabled }}
{{- $streaming := .Values.deployment.db.streaming }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "supabase.db.streaming.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  annotations:
    # Runs BEFORE the rest of an upgrade, and after a fresh install.
    #
    # The order matters more than it looks. A reader deployed next to this
    # database cannot start until the role it logs in as has a password — and
    # under Argo CD, a post-sync hook only runs once every synced resource is
    # healthy. Leave this hook post-only and the two wait for each other: the
    # reader for its password, the password for the reader. Observed, not feared.
    #
    # pre-upgrade breaks that cycle: the capability is opened first, and whatever
    # depends on it is judged afterwards. post-install keeps the fresh case, where
    # there is no database yet to prepare when the sync begins.
    #
    # Argo CD does not distinguish install from upgrade: it renders both hooks, so
    # this runs in PreSync and again in PostSync. That costs one idempotent replay
    # and is exactly what makes the first sync converge — see the tolerated wait
    # below.
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  # A post-sync hook that never returns holds the whole sync. Bounded on both
  # sides: the wait below gives up, and the deadline covers the pod never
  # getting that far (image pull, scheduling).
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "supabase.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-streaming
    spec:
      restartPolicy: Never
      {{- with .Values.deployment.db.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.db.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: streaming
          image: "{{ .Values.image.db.repository }}:{{ .Values.image.db.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.db.pullPolicy }}
          env:
            {{- include "supabase.db.hostEnv" (dict "root" . "name" "PGHOST") | nindent 12 }}
            {{- include "supabase.db.portEnv" (dict "root" . "name" "PGPORT") | nindent 12 }}
            - name: PGUSER
              value: {{ $streaming.superuser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.secret.db.name" . }}
                  key: {{ include "supabase.secret.db.key.password" . }}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.secret.db.name" . }}
                  key: {{ include "supabase.secret.db.key.database" . }}
            - name: PGCONNECT_TIMEOUT
              value: "10"
            {{- with $streaming.reader.secretRef }}
            - name: STREAMING_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ index (default (dict) $streaming.reader.secretRefKey) "password" | default "password" }}
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              # On the very first sync there is no database yet: it is created in
              # the phase this hook now runs before. Waiting the full window and
              # failing would block that creation for good, so an absent database
              # is not an error here — it is "nothing to prepare yet". The hook
              # runs again once it exists, and the reader recovers on its own.
              attempts=0
              until pg_isready -q; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "No database to prepare yet; leaving it for the next run."
                  exit 0
                fi
                echo "Waiting for the database to accept connections..."
                sleep 5
              done

              psql -X -q -v ON_ERROR_STOP=1 -f /streaming/latent.sql
              echo "Latent streaming objects are in place."

              {{- if $streaming.reader.secretRef }}
              if [ -z "${STREAMING_READER_PASSWORD:-}" ]; then
                echo "reader.secretRef is set but the password it points at is empty." >&2
                exit 1
              fi
              psql -X -q -v ON_ERROR_STOP=1 -f /streaming/password.sql
              echo "Reader password set; the role can now connect."
              {{- else }}
              echo "No reader password configured; the role cannot connect."
              {{- end }}
          volumeMounts:
            - mountPath: /streaming
              name: streaming
          {{- with .Values.deployment.db.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: streaming
          configMap:
            name: {{ include "supabase.db.streaming.fullname" . }}
{{- end }}
